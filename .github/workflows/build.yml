name: Build Executables and Windows Installer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up Python 3.9 (Win7 to Win11 Compatibility)
    uses: actions/setup-python@v5
    with:
      python-version: '3.9'

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install pyinstaller speechrecognition pyttsx3 selenium webdriver-manager vosk sounddevice numpy

  - name: Build Controller Executable
    run: |
      pyinstaller --onefile --noconsole --name controller controller.py

  - name: Build Dashboard Executable
    run: |
      pyinstaller --onefile --noconsole --name dashboard dashboard.py

  - name: Install Inno Setup
    run: choco install innosetup -y

  - name: Build Installer Package
    run: |
      iscc controller_setup.iss

  - name: Upload Installer Executable
    uses: actions/upload-artifact@v4
    with:
      name: HackworldController_Installer
      path: Output/HackworldController_Setup.exe
