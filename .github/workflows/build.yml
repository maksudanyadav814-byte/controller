name: Build Executables and Windows Installer

on:
 push:
  branches:
  - main
  - master
 workflow_dispatch:

jobs:
 build:
  runs-on: windows-latest
  steps:
  # STREAMING_CHUNK:Checking out repository source code...
   - name: Checkout Repository
     uses: actions/checkout@v4

  # STREAMING_CHUNK:Setting up Python environment...
   - name: Set up Python 3.10
     uses: actions/setup-python@v5
     with:
      python-version: '3.10'

  # STREAMING_CHUNK:Installing required Python libraries...
   - name: Install Dependencies
     run: |
      python -m pip install --upgrade pip
      pip install pyinstaller speechrecognition pyttsx3 selenium webdriver-manager vosk sounddevice numpy mysql-connector-python pillow

  # STREAMING_CHUNK:Building Voice Controller executable...
   - name: Build Main Controller Executable
     run: |
      if (Test-Path "logo.ico") {
        pyinstaller --onefile --noconsole --collect-all vosk --icon=logo.ico --name "Voice to Control" controller.py
      } else {
        pyinstaller --onefile --noconsole --collect-all vosk --name "Voice to Control" controller.py
      }

  # STREAMING_CHUNK:Installing Inno Setup via Chocolatey...
   - name: Install Inno Setup
     run: choco install innosetup -y

  # STREAMING_CHUNK:Compiling installer setup EXE...
   - name: Build Installer Package
     run: |
      if (Test-Path "controller_setup.iss") {
        iscc controller_setup.iss
      } else {
        echo "No .iss script found, skipping installer build step."
      }

  # STREAMING_CHUNK:Uploading generated installer artifact...
   - name: Upload Generated Installer Artifact
     uses: actions/upload-artifact@v4
     with:
      name: Voice_to_Control_Installer
      path: |
        dist/*.exe
        Output/*.exe
