name: Build Executable and Windows Installer

on:
 push:
  branches: [ "main", "master" ]
 workflow_dispatch:

jobs:
 build:
  runs-on: windows-latest

  steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up Python 3.9
    uses: actions/setup-python@v5
    with:
      python-version: '3.9'

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install pyinstaller speechrecognition selenium webdriver-manager vosk sounddevice numpy requests pycaw comtypes mysql-connector-python pywin32

  - name: Build Unified Application Executable
    run: |
      if (Test-Path "logo.ico") {
          pyinstaller --onefile --noconsole --collect-all vosk --icon=logo.ico --name "Voice to Control" main.py
      } else {
          pyinstaller --onefile --noconsole --collect-all vosk --name "Voice to Control" main.py
      }

  - name: Install Inno Setup
    run: choco install innosetup -y

  - name: Build Installer Package
    run: |
      iscc controller_setup.iss

  - name: Upload Installer Executable
    uses: actions/upload-artifact@v4
    with:
      name: HackworldController_Installer
      path: Output/Voice_to_Control_Setup.exe
